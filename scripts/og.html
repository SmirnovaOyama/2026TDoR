<!doctype html>
<!-- The link preview image, public/og.png. Rebuild it with `npm run og` after the count changes. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  :root {
    --text: oklch(98.7% 0.002 89);
    --text-muted: oklch(72% 0.01 88);
    --flame-outer: oklch(70% 0.16 45);
    --flame-mid: oklch(83% 0.14 75);
    --flame-core: oklch(95% 0.06 95);
    --wick: oklch(40% 0.02 60);
    --wax: oklch(89% 0.02 85);
    --wax-light: oklch(96% 0.012 85);
    --wax-shade: oklch(77% 0.025 75);
  }
  html, body { margin: 0; width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: 80px 80px 80px 88px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    align-items: center;
    gap: 72px;
    color: var(--text);
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .text { display: grid; gap: 28px; }
  .date { font: 500 22px/28px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--text-muted); }
  h1 { margin: 0; font-weight: 300; font-size: 76px; line-height: 0.98; letter-spacing: -0.04em; }
  .count { font: 400 24px/34px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--text-muted); max-width: 30em; }
  .count b { color: var(--text); font-weight: 500; }
  .wall { display: grid; grid-template-columns: repeat(11, 12px); grid-auto-rows: 12px; gap: 3px; justify-content: center; }
  .wall i { display: block; border-radius: 2px; }
</style>
</head>
<body>
  <div class="text">
    <p class="date" style="margin:0">20 November 2026</p>
    <h1>Transgender Day of Remembrance</h1>
    <p class="count" style="margin:0"><b>273</b> trans and gender diverse people reported murdered between 1&nbsp;October&nbsp;2025 and 30&nbsp;September&nbsp;2026</p>
  </div>
  <div class="wall" id="wall"></div>
  <script>
    // The count's pixel candle, as on the page (src/wall.ts): one square per person,
    // a teardrop flame of 52, one square of wick and a body of 11 × 20.
    const total = 273, cols = 11, mid = 5;
    const FLAME = [1, 1, 1, 3, 3, 5, 5, 7, 7, 7, 7, 5];
    const cells = new Map();
    FLAME.forEach((w, r) => {
      const half = (w - 1) / 2;
      for (let c = mid - half; c <= mid + half; c++) {
        const edge = half - Math.abs(c - mid);
        cells.set(r * cols + c, w === 1 || edge === 1 ? '--flame-mid' : edge === 0 ? '--flame-outer' : '--flame-core');
      }
    });
    const bodyTop = FLAME.length + 1;
    cells.set(FLAME.length * cols + mid, '--wick');
    const bodyRows = Math.ceil((total - cells.size) / cols);
    const drips = new Set([`${bodyTop + 1}:3`, `${bodyTop + 2}:3`, `${bodyTop + 3}:3`, `${bodyTop + 1}:7`, `${bodyTop + 2}:7`]);
    for (let r = bodyTop; r < bodyTop + bodyRows; r++) {
      for (let c = 0; c < cols; c++) {
        cells.set(r * cols + c, r === bodyTop || drips.has(`${r}:${c}`) || c === 1 ? '--wax-light' : c >= cols - 2 ? '--wax-shade' : '--wax');
      }
    }
    const wall = document.getElementById('wall');
    for (let i = 0; i < cols * (bodyTop + bodyRows); i++) {
      const colour = cells.get(i);
      const el = document.createElement(colour ? 'i' : 'span');
      if (colour) el.style.background = `var(${colour})`;
      wall.append(el);
    }
  </script>
</body>
</html>
